<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed Successfully!</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .success-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #eaeaea;
            animation: fadeIn 0.4s ease-in-out;
        }
        .icon-box {
            width: 90px;
            height: 90px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 0 auto 25px auto;
            animation: scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        h1 {
            color: #0f1111;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .order-info {
            background: #f8f9fa;
            border: 1px dashed #2e7d32;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            color: #2e7d32;
            display: inline-block;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 25px;
            background: #ffd814;
            color: #0f1111;
            border: 1px solid #fcd200;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn-home:hover {
            background: #f7ca00;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleUp {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-box">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1>Order Placed Successfully!</h1>
        <p>Thank you for your purchase. We have received your order and are currently processing it.</p>
        
        <div class="order-info">
            Order Number: #<span id="order-number"></span>
        </div>

        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-house"></i> Continue Shopping
        </a>
    </div>

    <script>
        // إنشاء رقم طلب عشوائي
        document.getElementById('order-number').innerText = Math.floor(100000 + Math.random() * 900000);
        
        // تفريغ السلة من LocalStorage فور إتمام الشراء
        localStorage.removeItem('cart');
    </script>
</body>
</html>
