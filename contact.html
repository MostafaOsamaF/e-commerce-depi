<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - David Online Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Reset */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        /* Hero Header */
        .contact-hero {
            background: linear-gradient(135deg, #2b2d42 0%, #11121d 100%);
            color: #fff;
            text-align: center;
            padding: 60px 20px 100px;
            width: 100%;
        }

        .contact-hero h1 { 
            font-size: 38px; 
            margin-bottom: 10px; 
        }
        
        .contact-hero p { 
            color: #ccc; 
            font-size: 17px; 
        }

        /* Top Info Cards Layout */
        .cards-wrapper {
            max-width: 1000px;
            margin: -60px auto 40px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .info-card {
            background: #fff;
            padding: 35px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 1px solid #f0f0f0;
            word-wrap: break-word;
        }

        .info-card i {
            font-size: 26px;
            color: #ff7d1a;
            background: #fff3eb;
            width: 65px;
            height: 65px;
            line-height: 65px;
            border-radius: 50%;
            margin-bottom: 15px;
            display: inline-block;
        }

        .info-card h4 { 
            margin-bottom: 8px; 
            color: #222; 
            font-size: 18px;
        }
        
        .info-card p { 
            color: #555; 
            font-size: 15px; 
            word-break: break-all;
        }

        /* Contact Form Layout */
        .form-section {
            max-width: 800px;
            margin: 0 auto 60px;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
            width: 100%;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .full-width { 
            grid-column: span 2; 
        }

        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #333; 
            font-size: 15px; 
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            outline: none;
            background: #fafafa;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #ff7d1a;
            background: #fff;
        }

        .submit-btn {
            background: #ff7d1a;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .submit-btn:hover { 
            background: #e06910; 
        }

        /* ==========================================
           Media Queries for Full Responsiveness
        ========================================== */
        @media (max-width: 768px) {
            .contact-hero {
                padding: 45px 20px 70px;
            }

            .contact-hero h1 {
                font-size: 28px;
            }

            .contact-hero p {
                font-size: 15px;
            }

            .cards-wrapper {
                grid-template-columns: 1fr;
                margin: -40px auto 30px;
                padding: 0 20px;
                gap: 15px;
            }

            .info-card {
                padding: 25px 20px;
            }

            .form-section {
                padding: 25px 20px;
                margin: 0 15px 40px;
                width: auto;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .full-width {
                grid-column: span 1;
            }
        }

        @media (max-width: 480px) {
            html, body {
                overflow-x: hidden !important;
                width: 100% !important;
            }

            .contact-hero {
                padding: 35px 15px 50px;
            }

            .contact-hero h1 {
                font-size: 24px;
            }

            .contact-hero p {
                font-size: 14px;
            }

            .cards-wrapper {
                padding: 0 15px;
            }

            .form-section {
                margin: 0 10px 30px;
                padding: 20px 15px;
            }

            .form-group input, 
            .form-group textarea {
                font-size: 14px;
                padding: 12px 14px;
            }

            .submit-btn {
                font-size: 16px;
                padding: 13px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="contact-hero">
        <h1>Contact Our Team</h1>
        <p>Got a question? We're here to help you 24/7.</p>
    </div>

    <!-- 3 Info Cards -->
    <div class="cards-wrapper">
        <div class="info-card">
            <i class="fa-solid fa-location-dot"></i>
            <h4>Location</h4>
            <p>Cairo, Egypt</p>
        </div>
        <div class="info-card">
            <i class="fa-solid fa-envelope"></i>
            <h4>Email Us</h4>
            <p>support@davidshop.com</p>
        </div>
        <div class="info-card">
            <i class="fa-solid fa-phone"></i>
            <h4>Call Us</h4>
            <p>+20 123 456 7890</p>
        </div>
    </div>

    <!-- Form -->
    <div class="form-section">
        <form id="contactForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" required placeholder="john@example.com">
                </div>
                <div class="form-group full-width">
                    <label>Subject</label>
                    <input type="text" required placeholder="How can we help?">
                </div>
                <div class="form-group full-width">
                    <label>Message</label>
                    <textarea rows="5" required placeholder="Write your message here..."></textarea>
                </div>
                <div class="full-width">
                    <button type="submit" class="submit-btn">Send Message</button>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
